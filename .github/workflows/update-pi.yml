name: update-pi

on:
    schedule:
        - cron: "0 10 * * *"
    workflow_dispatch:
        inputs:
            version:
                description: Pi version to install; leave empty for the latest stable release
                required: false
                type: string

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    update:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - id: not-adam
              uses: adampoit/not-adam@v1
              with:
                  private-key: ${{ secrets.NOT_ADAM_APP_PRIVATE_KEY }}

            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  token: ${{ steps.not-adam.outputs.token }}

            - name: Setup Nix
              uses: nixbuild/nix-quick-install-action@v35

            - name: Configure repository cache
              env:
                  CACHE_URL: ${{ vars.NIX_CACHE_URL }}
                  CACHE_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
              run: |
                  set -euo pipefail
                  mkdir -p ~/.config/nix
                  if [ -n "$CACHE_URL" ]; then
                    printf '%s\n' "extra-substituters = $CACHE_URL" >> ~/.config/nix/nix.conf
                  fi
                  if [ -n "$CACHE_KEY" ]; then
                    printf '%s\n' "extra-trusted-public-keys = $CACHE_KEY" >> ~/.config/nix/nix.conf
                  fi

            - name: Update Pi package
              env:
                  UPDATE_VERSION: ${{ inputs.version || '' }}
              run: |
                  set -euo pipefail
                  args=(
                    pi-coding-agent
                    --flake
                    --override-filename nix/pi-coding-agent-source.nix
                    --use-github-releases
                  )
                  if [ -n "$UPDATE_VERSION" ]; then
                    args+=(--version "$UPDATE_VERSION")
                  fi
                  nix develop -c nix-update "${args[@]}"

            - name: Check for an update
              id: update
              run: |
                  set -euo pipefail
                  if git diff --quiet --exit-code -- nix/pi-coding-agent-source.nix; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                    echo "version=$(nix eval --raw .#pi-coding-agent.version)" >> "$GITHUB_OUTPUT"
                  fi

            - name: Synchronize npm dependencies
              if: steps.update.outputs.changed == 'true'
              run: |
                  set -euo pipefail
                  version="${{ steps.update.outputs.version }}"
                  nix develop -c npm install --save-dev --save-exact \
                    "@earendil-works/pi-agent-core@$version" \
                    "@earendil-works/pi-ai@$version" \
                    "@earendil-works/pi-coding-agent@$version" \
                    "@earendil-works/pi-tui@$version"

            - name: Format package metadata
              if: steps.update.outputs.changed == 'true'
              run: nix run nixpkgs#alejandra -- nix/pi-coding-agent-source.nix

            - name: Validate update
              if: steps.update.outputs.changed == 'true'
              run: |
                  set -euo pipefail
                  nix develop -c npm run typecheck
                  nix develop -c npm test
                  nix flake check --print-build-logs

            - name: Create pull request
              id: create-pull-request
              if: steps.update.outputs.changed == 'true'
              uses: peter-evans/create-pull-request@v8
              with:
                  token: ${{ steps.not-adam.outputs.token }}
                  add-paths: |
                      nix/pi-coding-agent-source.nix
                      package.json
                      package-lock.json
                  branch: automation/update-pi
                  delete-branch: true
                  commit-message: Update Pi to ${{ steps.update.outputs.version }}
                  title: Update Pi to ${{ steps.update.outputs.version }}
                  body: |
                      ## Summary
                      - update the pinned Pi runtime with `nix-update`
                      - synchronize Pi extension development dependencies
                      - run typechecking, unit tests, and flake checks
                  labels: dependencies
